<form [formGroup]="checkboxForm">
    <ddr-checkbox
        [options]="options()"
        [label]="'checkbox.label' | ddrTranslate"
        [compareFn]="compareFn"
        formControlName="checkbox" />

    <div class="mt-2">
        <span>{{'checkbox.value' | ddrTranslate}}: {{checkboxForm.value | json}}</span>
    </div>

</form>
