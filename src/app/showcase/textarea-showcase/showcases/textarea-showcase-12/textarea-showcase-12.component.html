<form [formGroup]="textareaForm">
    <ddr-textarea 
        [label]="'textarea.label' | ddrTranslate" 
        [placeholder]="'textarea.placeholder' | ddrTranslate"
        formControlName="textarea"
        name="textarea-12" />

    <div class="mt-2">
        <span>{{'textarea.value' | ddrTranslate}}: {{textareaForm.value | json}}</span>
    </div>
</form>
