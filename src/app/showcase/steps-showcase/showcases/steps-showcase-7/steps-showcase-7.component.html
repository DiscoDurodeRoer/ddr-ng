<ddr-steps 
    [showButtons]="false">

    <ddr-step 
        [titleStep]="'step.1' | ddrTranslate" 
        [canGoNext]="true">
        <ng-template #stepContent>
            <p>{{'step.1' | ddrTranslate}}</p>
        </ng-template>
    </ddr-step>

    <ddr-step 
        [titleStep]="'step.2' | ddrTranslate" 
        [canGoNext]="true">
        <ng-template #stepContent>
            <p>{{'step.2' | ddrTranslate}}</p>
        </ng-template>
    </ddr-step>

</ddr-steps>
