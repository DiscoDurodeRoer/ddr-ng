<form [formGroup]="inputForm">
    <ddr-input-group
        [label]="'input.group.label' | ddrTranslate"
        [placeholder]="'input.group.placeholder' | ddrTranslate"
        icon="bi bi-send"
        formControlName="input"
        name="input-group-14"  />

    <div class="mt-2">
        <span>{{'input.group.value' | ddrTranslate}}: {{inputForm.value | json}}</span>
    </div>
</form>
