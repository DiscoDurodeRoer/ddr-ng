<div class="row mt-3 mb-3">
    <div class="col-12">
        <p>{{'paginator.size' | ddrTranslate}}:</p>
        <ddr-button-multiple 
            [buttons]="buttonsSize()" 
            [showSelectedButton]="true" 
            [(value)]="size" />
    </div>
</div>

<ul>
    @for(item of data() | ddrPaginator: page() : pageSize(); track item){
        <li>{{item}}</li>
    }
</ul>

<ddr-paginator
    [(page)]="page"
    [pageSize]="pageSize()"
    [size]="size()"
    [totalItems]="data().length"
/>
