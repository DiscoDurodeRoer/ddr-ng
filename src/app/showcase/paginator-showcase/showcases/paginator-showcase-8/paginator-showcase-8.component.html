<ul>
    @for(item of data() | ddrPaginator: page() : pageSize(); track item){
        <li>{{item}}</li>
    }
</ul>

<ddr-paginator
    [(page)]="page"
    [pageSize]="pageSize()"
    [totalItems]="data().length"
    [showNavigation]="true"
    (changePage)="onChangePage($event)"
    (previous)="onPrevious($event)"
    (next)="onNext($event)"
/>
