<form [formGroup]="inputForm">
    <ddr-input 
        [label]="'input.label' | ddrTranslate" 
        [placeholder]="'input.placeholder' | ddrTranslate"
        formControlName="input"
        name="input-18" />

    <div class="mt-2">
        <span>{{'input.value' | ddrTranslate}}: {{inputForm.value | json}}</span>
    </div>
</form>
