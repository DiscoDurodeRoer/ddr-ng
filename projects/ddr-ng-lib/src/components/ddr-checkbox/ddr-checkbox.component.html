<div class="ddr-checkbox flex-row" 
  [class.flex-wrap]="inline()"
  [class.flex-column]="!inline()">
  @for (option of options(); track option) {
    <div class="ddr-checkbox__container" [class.me-4]="inline()">
      <div
        class="ddr-checkbox__container--input"
        [class.ddr-checkbox__container--input--active]="option.selected"
        [class.ddr-checkbox__container--input--desactive]="!option.selected"
        [class.ddr-checkbox__container--input--disabled]="disabled()"
        (click)="onClickCheck($event, option)">
        <i [hidden]="!option.selected" class="ddr-checkbox__container--input--icon bi bi-check" aria-hidden="true"></i>
      </div>
      @if (option.label) {
        <span class="ddr-checkbox__container--label">{{option.label | ddrTranslate}}</span>
      }
    </div>
  }
</div>
