<div class="ddr-radio" 
  [class.flex-row]="inline()"
  [class.flex-wrap]="inline()"
  [class.flex-column]="!inline()">
  @for (option of options(); track option) {
    <div class="ddr-radio__container user-select-none" [class.me-4]="inline()">
      <div
        class="ddr-radio__container--input"
        [class.ddr-radio__container--input--active]="option.selected"
        [class.ddr-radio__container--input--desactive]="!option.selected"
        (click)="onclickRadio(option)">
        
        @if (option.selected) {
          <i class="ddr-radio__container--input--icon bi bi-check" aria-hidden="true"></i>
        }
      </div>
      @if (option.label) {
        <span class="ddr-radio__container--label">{{option.label | ddrTranslate}}</span>
      }
    </div>
  }
</div>
