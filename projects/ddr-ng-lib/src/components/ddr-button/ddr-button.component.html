<button
  ddrTooltip 
  [tooltipText]="tooltipText()"
  [tooltipOrientation]="tooltipOrientation()"
  [class]="'btn-ddr cursor-pointer btn-ddr--mode-' + mode()"
  [class.btn-ddr--block]="block()"
  [class.btn-ddr--inline]="!block()"
  [class.btn-ddr--border]="border()"
  [class.btn-ddr--without-border]="!border()"
  [class.btn-ddr--small]="size() == constants.SIZE.SMALL"
  [class.btn-ddr--medium]="size() == constants.SIZE.MEDIUM"
  [class.btn-ddr--large]="size() == constants.SIZE.LARGE"
  [class.btn-ddr--disabled]="disabled()"
  [class.cursor-pointer]="!disabled()"
  [class.cursor-default]="disabled()"
  [class.btn-ddr--float-button]="floatButton()"
  [class.btn-ddr--float-button--bottom-left]="floatButton() && positionButton() == constants.ORIENTATION.BOTTOM_LEFT"
  [class.btn-ddr--float-button--bottom-center]="floatButton() && positionButton() == constants.ORIENTATION.BOTTOM_CENTER"
  [class.btn-ddr--float-button--bottom-right]="floatButton() && positionButton() == constants.ORIENTATION.BOTTOM_RIGHT"
  [class.btn-ddr--float-button--top-left]="floatButton() && positionButton() == constants.ORIENTATION.TOP_LEFT"
  [class.btn-ddr--float-button--top-center]="floatButton() && positionButton() == constants.ORIENTATION.TOP_CENTER"
  [class.btn-ddr--float-button--top-right]="floatButton() && positionButton() == constants.ORIENTATION.TOP_RIGHT"
  [class.btn-ddr--transparent]="transparent()"
  [disabled]="disabled()"
  [type]="type()"
  (click)="clickButton($event)">
  @if (icon() && iconPosition() == 'left') {
    <i
      [class]="'btn-ddr--icon ' + icon() + ' btn-ddr--icon-left'"
      [class.btn-ddr--float-button--items]="floatButton()">
    </i>
  }
  @if (img()) {
    <img class="btn-ddr--img" [src]="img()" />
  }
  @if (text()) {
    <span class="btn-ddr--text">
      {{ text() | ddrTranslate }}
    </span>
  }
  @if (icon() && iconPosition() == 'right') {
    <i
      [class]="'btn-ddr--icon ' + icon() + ' btn-ddr--icon-right'"
      [class.btn-ddr--float-button--items]="floatButton()"
      >
    </i>
  }
</button>
