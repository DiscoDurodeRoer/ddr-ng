<div class="ddr-textarea" [class.ddr-textarea--inline]="inline()">
  @if (label()) {
    <label class="ddr-textarea__label"
      [attr.for]="name()"
      [class.ddr-textarea__label--inline]="inline()"
      [class.fw-bold]="labelBold()"
    >{{ label() + (required() ? "(*):" : "") }}</label>
    @if (tooltipText()) {
      <i
        class="bi bi-info-circle"
        ddrTooltip
        [tooltipOrientation]="tooltipOrientation()"
        [tooltipText]="tooltipText()">
      </i>
    }
  }
  <textarea
    class="ddr-textarea__textarea"
    [attr.id]="name()"
    [name]="name()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readonly]="readonly()"
    [attr.maxlength]="maxLength()"
    [attr.minlength]="minLength()"
    [required]="required()"
    [cols]="cols()"
    [rows]="rows()"
    [value]="value()"
    [class.is-valid]="validate() && dirtyInput() && valid()"
    [class.is-invalid]="validate() && dirtyInput() && !valid()"
    [class.w-100]="!inline()"
    [class.ddr-textarea__textarea--inline]=" inline()"
    (input)="onInput($event)"
    (click)="onClick($event)"
    (keyup)="onKeyup()"
    (blur)="onBlur()"></textarea>
  <!--Validation-->
  @if (validate() && dirtyInput() && valid()) {
    <div
      [class.w-auto]="inline()" 
      [class.d-inline-block]="inline()" 
      [class.ms-1]="inline()"
      class="valid-feedback">
        <ng-template [ngTemplateOutlet]="templateValid()" />
    </div>
  }
  @if (validate() && dirtyInput() && !valid()) {
    <div
      [class.w-auto]="inline()" 
      [class.d-inline-block]="inline()" 
      [class.ms-1]="inline()"
      class="invalid-feedback">
      <ng-template
        [ngTemplateOutlet]="templateErrors()"
        [ngTemplateOutletContext]="{ errors }" />
    </div>
  }
</div>
