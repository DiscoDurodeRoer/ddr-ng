<div class="ddr-input-group" [class.d-inline-flex]="inline()">
  <ddr-input class="ddr-input-group__input" 
    [border]="true" 
    [label]="label()"
    [ariaLabel]="ariaLabel()"
    [size]="size()"
    [dirty]="dirty()"
    [validate]="validate()" 
    [maxLength]="maxLength()"
    [minLength]="minLength()"
    [required]="required()"
    [placeholder]="placeholder()" 
    [disabled]="disabled()"
    [readonly]="readonly()"
    [labelBold]="labelBold()"
    [inline]="inline()" 
    [pattern]="pattern()"
    [errors]="errors()"
    [value]="value()"
    [name]="name()" 
    [tooltipOrientation]="tooltipOrientation()"
    [tooltipText]="tooltipText()"
    [transparent]="transparent()"
    [focus]="focus()"
    [autocomplete]="autocomplete()"
    [(value)]="value" 
    (hasErrors)="checkInput($event)"
    (keyPressed)="onKeyup($event)"
    (clickInput)="onclickInput($event)"
    (focusLost)="onFocusLost()">

    <ng-template #templateValid>
      <ng-container [ngTemplateOutlet]="templateValidOutside()" />
    </ng-template>

    <ng-template #templateErrors let-errors="errors">
      <ng-container 
        [ngTemplateOutlet]="templateErrorsOutside()"
        [ngTemplateOutletContext]="{ errors }" />
    </ng-template>

  </ddr-input>
  <ddr-button class="ddr-input-group__button" 
    [class.ddr-input-group__button--is-valid]="validate() && errorsInput() == constants.INPUT_ERRORS.VALID"
    [class.ddr-input-group__button--is-invalid]="(validate() && errorsInput() == constants.INPUT_ERRORS.ERROR) || (required() && !value() && errorsInput() != constants.INPUT_ERRORS.NEUTRAL)"
    [block]="true" 
    [type]="constants.TYPE_BUTTON.BUTTON" 
    [icon]="icon()"
    [transparent]="transparent()"
    [disabled]="disabled() || disabledButton()"
    [size]="size()"
    [ariaLabel]="ariaLabel()"
    (action)="clickButton($event)" />
</div>
