<div class="ddr-dropdown-multiple">
    <ddr-dropdown 
        [options]="optionsDropdown()"
        [showFilter]="showFilter()"
        [label]="label()"
        [ariaLabel]="ariaLabel()"
        [name]="name()"
        [inline]="inline()"
        [orientation]="orientation()"
        [labelPlaceholderFilter]="labelPlaceholderFilter()"
        [labelNoResults]="labelNoResults()"
        [disabled]="disabled()"
        [placeholder]="placeholder()"
        [required]="required()"
        [translate]="translate()"
        [modalOptions]="modalOptions()"
        [tooltipOrientation]="tooltipOrientation()"
        [tooltipText]="tooltipText()"
        [closeOnSelect]="false"
        [allowDeselect]="true"
        [validate]="validate()"
        [compareFn]="compareFn()"
        [transparent]="transparent()"
        [textInput]="textInput()"
        (selectItem)="onSelectItem($event)">

        <ng-template #itemTemplate let-item="item">
            <ddr-checkbox-binary class="flex-0 me-2"
                [label]="item.label"
                [(value)]="item.selected"
                (clickCheck)="onSelectItem(item)" />
            @if (itemTemplateOutside()) {
                <ng-container
                  [ngTemplateOutlet]="itemTemplateOutside()"
                  [ngTemplateOutletContext]="{ item }"
                />
            }         
        </ng-template>

        <ng-template #templateValid>
            <ng-container [ngTemplateOutlet]="templateValidOutside()" />
        </ng-template>

        <ng-template #templateErrors let-errors="errors">
            <ng-container 
                [ngTemplateOutlet]="templateErrorsOutside()"
                [ngTemplateOutletContext]="{ errors }" />
        </ng-template>

    </ddr-dropdown>
</div>
