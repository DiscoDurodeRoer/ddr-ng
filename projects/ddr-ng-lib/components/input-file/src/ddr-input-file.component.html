<div class="ddr-input-file">
  <input
    #ddrFileInput
    type="file"
    [attr.accept]="accept()"
    [attr.multiple]="multiple() ? true : null"
    class="d-none"
    (change)="onFileSelected($event)" />

  <ddr-input-group
    [label]="label()"
    [ariaLabel]="ariaLabel()"
    icon="bi bi-upload"
    [value]="fileNames()" 
    [inline]="inline()"
    [required]="required()" 
    [disabled]="disabled()"
    [labelBold]="labelBold()"
    [readonly]="true"
    [name]="name()"
    [tooltipOrientation]="tooltipOrientation()"
    [tooltipText]="tooltipText()"
    (action)="ddrFileInput.click()"
    (clickInput)="ddrFileInput.click()" />
</div>
